[project]
name = "tinycalc"
version = "0.1.0"
description = "A tiny calculator library (demo target for ProofPay bounties)."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinycalc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
